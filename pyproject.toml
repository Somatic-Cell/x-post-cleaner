[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "post-review"
version = "0.1.0"
description = "Review-first, local X post curation with Jev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "oauthlib>=3.3.1,<4",
  "filelock>=3.16,<4",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
tui = ["textual==8.2.8"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8"]

[project.scripts]
post-review = "post_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"
