name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[tui,dev]"
      - name: Show checked-out commit
        run: git rev-parse HEAD
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify runtime dependencies
        run: python -c "import sys, tzdata, pytest_cov, textual; from zoneinfo import ZoneInfo; print(sys.executable); print(sys.version); print(ZoneInfo('Asia/Tokyo')); print('Textual:', textual.__version__)"
      - run: python -m compileall -q src tests
      - run: python -m pytest --cov=post_review --cov-report=term-missing
